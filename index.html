html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:300 17px/1.6 var(--f);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.wrap{padding:0 max(16px,3.6vw)}
.hero{min-height:100svh;display:flex;flex-direction:column}
.g3{display:grid;grid-template-columns:37.8% 21.2% 1fr;font-size:14px;line-height:1.4}
.c3{display:flex;justify-content:space-between;gap:16px}
.hero header{padding:max(20px,3.2vh) 0}
.hero header .c3{justify-content:flex-end}
.logo{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1;letter-spacing:.01em}
a:hover{color:var(--mute)}
.word{flex:1 1 0;min-height:18vh;display:flex;align-items:center;margin:0;font-weight:300;font-size:100px;line-height:1;letter-spacing:0;font-family:var(--serif)}
.word span{display:inline-block;white-space:nowrap}
.low{align-items:start;padding-bottom:clamp(36px,9vh,100px)}
.big a{display:block;font-family:var(--serif);font-weight:400;text-transform:uppercase;font-size:clamp(20px,2.1vw,30px);line-height:1.2}
.small a{display:block;line-height:1.85}
.tag{margin-top:0;color:var(--mute);font-size:12px;max-width:32ch;line-height:1.5}
.foot{padding:0 0 max(20px,2.6vh)}
.st::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-right:14px;vertical-align:middle}
.soc{display:flex;gap:16px}
#work{padding-top:clamp(40px,9vh,110px)}
.wrow{display:grid;grid-template-columns:31% 1fr;column-gap:clamp(16px,2.4vw,40px);align-items:start;padding:clamp(16px,2.2vw,28px) 0;font-size:14px;line-height:1.4;transition:grid-template-columns .6s cubic-bezier(.2,.7,.2,1)}
.wrow+.wrow{border-top:1px solid var(--line)}
.wn{padding-top:2px}
.wph{aspect-ratio:4/3;width:100%;min-width:0;cursor:pointer}
.wtx{display:grid;grid-template-columns:minmax(0,.5fr) minmax(0,1fr);gap:16px;align-items:start}
.wt{font-family:var(--serif);text-transform:uppercase;font-size:clamp(16px,1.35vw,20px);line-height:1.2;letter-spacing:.01em}
.wc{display:flex;justify-content:space-between;gap:16px}
.wc b{font-weight:500}.wc .r{color:var(--mute)}
.wa{transition:transform .3s}
.works{border-bottom:1px solid var(--mute)}
@media (hover:hover) and (min-width:761px){.wrow:has(.wph:hover),.wrow:has(.wph:focus-visible){grid-template-columns:54% 1fr}}
@media (max-width:760px){.wrow{grid-template-columns:1fr;row-gap:12px;padding:20px 0}.wn{color:var(--mute)}.wtx{grid-template-columns:1fr;gap:10px}}
/* наведение: слегка приподнимается и увеличивается */
@media (hover:hover){a:not(.wph),button{transition:transform .22s cubic-bezier(.2,.7,.2,1),color .2s}
 a:not(.wph):hover,a:not(.wph):focus-visible,button:hover,button:focus-visible{transform:translateY(-3px) scale(1.05)}
 .big a,.about a{transform-origin:left center}}
.hn a{display:inline-block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding:22px 0 36px;font-size:15px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:56px clamp(20px,3vw,44px)}
.grid.one{grid-template-columns:1fr}.grid.one .card{max-width:760px}
.card{display:block;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;width:100%}
.ph{background:linear-gradient(135deg,var(--ph1),var(--ph2));width:100%;display:block;position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .ph{aspect-ratio:4/3;transition:opacity .25s}
.card:hover .ph{opacity:.82}
.card h3{font-weight:400;font-size:21px;margin-top:16px;letter-spacing:-.01em}
.card span{color:var(--mute);font-size:15px}
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:96px 0;border-top:1px solid var(--line);margin-top:96px}
.about h2{font-weight:300;font-size:clamp(26px,3vw,40px);line-height:1.2;letter-spacing:-.02em;max-width:18ch}
.about p{color:var(--mute);max-width:52ch}
.about .ct{margin-top:0;display:flex;flex-direction:column;gap:4px;color:var(--ink);font-weight:400}
footer{padding:28px 0 40px;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
/* project view */
.proj{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:in .5s cubic-bezier(.22,.8,.2,1)}
.proj[hidden]{display:none}
@keyframes in{from{opacity:0;transform:translateX(10vw)}to{opacity:1;transform:none}}
.bar{display:flex;justify-content:space-between;align-items:center;padding:24px 0;font-size:15px;font-weight:400}
.bar button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:6px 0}
.bar button:hover{color:var(--mute)}
.phead{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;padding:48px 0 56px;align-items:end}
.phead h2{font-weight:300;font-size:clamp(34px,5.4vw,84px);line-height:1.04;letter-spacing:-.03em}
.phead p{color:var(--mute);max-width:42ch}
.phead dl{display:grid;grid-template-columns:auto 1fr;gap:6px 24px;margin-top:20px;font-size:15px}
.phead dt{color:var(--mute)}.phead dd{font-weight:400}
.rows{display:flex;flex-direction:column;gap:clamp(72px,9vw,150px);padding-bottom:120px}
.rsec{display:flex;flex-direction:column;gap:20px}
.rbox{display:flex;flex-direction:column;gap:var(--g)}
.proj .wrap{padding:0 max(28px,8vw)}
.rh{font-family:var(--serif);font-weight:400;text-transform:uppercase;font-size:clamp(18px,1.6vw,24px);letter-spacing:.01em;line-height:1.2;border-top:1px solid var(--line);padding:18px 0 12px}
.rbox>.ph{aspect-ratio:var(--a);width:100%;border:0;padding:0;cursor:zoom-in}
.row{display:flex;gap:var(--g)}
.row .ph{flex:var(--r) 1 0;min-width:0;aspect-ratio:var(--a);cursor:zoom-in;border:0;padding:0}
.row .ph.nogrow{flex-grow:0}
.nextp{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:28px 0 56px;font-weight:400}
.nextp button{background:none;border:0;font:inherit;color:inherit;cursor:pointer}
.nextp button:hover{color:var(--mute)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:40}
.lb[hidden]{display:none}
.lbbg{position:absolute;inset:0;background:rgba(8,8,8,.96)}
.lbs{position:absolute;inset:calc(56px + env(safe-area-inset-top,0px)) 20px calc(56px + env(safe-area-inset-bottom,0px))}
.lbs .sl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.lbs .sl .ph{width:min(100%,calc((100svh - 112px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*var(--rn)));max-width:2000px;aspect-ratio:var(--a);flex:none;will-change:transform}
.lb button{position:absolute;background:none;border:0;color:#ecebe7;font:400 15px var(--f);cursor:pointer;padding:12px 16px}
.lb .x{top:calc(10px + env(safe-area-inset-top,0px));right:10px}.lb .pv{left:6px;top:50%}.lb .nx{right:6px;top:50%}
@media (max-width:760px){.grid{grid-template-columns:1fr;gap:44px}.about,.phead{grid-template-columns:1fr;gap:28px}.row{flex-direction:column}.row .ph{flex:none;width:100%}header nav{gap:18px}.lb .pv,.lb .nx{top:auto;bottom:8px}}
@media (max-width:760px){.g3{grid-template-columns:1fr 1fr}.hero header{grid-template-columns:1fr auto}.hero header>span,.hn,.low>span,.foot>span:nth-child(2){display:none}
 .hero header .c3{justify-content:flex-end}.foot{grid-template-columns:1fr auto}.foot .c3{display:contents}.foot .soc{grid-column:1/-1;order:-1;margin-bottom:14px}.foot .cr{text-align:right}.tag{margin-top:28px}}
.about h2,.sec-h{font-family:var(--serif)}.about h2{font-weight:300}
@media (prefers-reduced-motion:reduce){.wrow{transition:none}a:hover,button:hover{transform:none!important}.proj{animation:none}html{scroll-behavior:auto}}
</style>

/* justified rows */
function layout(){
 if(cur<0)return;var p=PROJECTS[cur],host=$("rows");host.innerHTML="";thumbs=[];
 var probe=document.createElement("div");probe.className="row";host.appendChild(probe);var gap=parseFloat(getComputedStyle(probe).columnGap)||24;host.removeChild(probe);
 var W=host.clientWidth,mob=window.innerWidth<=760,H=Math.round(W*.52),groups=[],g=null;
 p.renders.forEach(function(r,k){if(!g||g.room!==r.room){g={room:r.room,items:[]};groups.push(g)}g.items.push({r:r,k:k})});
 groups.forEach(function(g){
  var sec=document.createElement("section");sec.className="rsec";
  if(g.room){var h=document.createElement("h3");h.className="rh";h.textContent=g.room;sec.appendChild(h)}
  var box=document.createElement("div");box.className="rbox";sec.appendChild(box);host.appendChild(sec);
  if(mob){g.items.forEach(function(it){var d=ph(it.r,"button");d.onclick=function(){openLb(it.k)};thumbs[it.k]=d;box.appendChild(d)});return}
  var row=[],sum=0;
  function flush(last){var el=document.createElement("div");el.className="row";
   row.forEach(function(it){var d=ph(it.r,"button");d.style.setProperty("--r",ratio(it.r));if(last&&sum*H+gap*(row.length-1)<W*.8)d.style.flex="0 0 "+Math.round(ratio(it.r)*H)+"px";d.onclick=function(){openLb(it.k)};thumbs[it.k]=d;el.appendChild(d)});
   box.appendChild(el);row=[];sum=0}
  g.items.forEach(function(it){row.push(it);sum+=ratio(it.r);if(sum*H+gap*(row.length-1)>=W)flush(false)});
  if(row.length)flush(true)})}

function show(i){
 var pe=$("proj");if(hiding){pe.getAnimations().forEach(function(x){x.cancel()});hiding=false}
 var was=!pe.hidden,dir=i>=cur?1:-1;
 cur=i;var p=PROJECTS[i];
 $("pt").textContent=p.title;$("pd").textContent=p.desc;$("pd").style.display=p.desc?"":"none";$("pn").textContent=pad(i+1)+" из "+pad(PROJECTS.length);
 var m=$("pm");m.innerHTML="";
 [p.type?["Тип",p.type]:null,p.year?["Год",p.year]:null,["Рендеров",p.renders.length]].filter(Boolean).forEach(function(x){var a=document.createElement("dt"),b=document.createElement("dd");a.textContent=x[0];b.textContent=x[1];m.appendChild(a);m.appendChild(b)});
 var pr=PROJECTS[(i-1+PROJECTS.length)%PROJECTS.length],nx=PROJECTS[(i+1)%PROJECTS.length];
 $("prevP").textContent="← "+pr.title;$("prevP").onclick=function(){go(pr.id)};
 $("nextP").textContent=nx.title+" →";$("nextP").onclick=function(){go(nx.id)};
 document.querySelector(".nextp").style.display=PROJECTS.length>1?"":"none";
 $("proj").hidden=false;$("proj").scrollTop=0;document.body.style.overflow="hidden";layout();
 if(was&&!RM)pe.firstElementChild.animate([{opacity:0,transform:"translateX("+(dir*10)+"vw)"},{opacity:1,transform:"none"}],{duration:520,easing:EASE})}
function hide(){
 var pe=$("proj");if(pe.hidden||hiding)return;
 cur=-1;closeLb(true);document.body.style.overflow="";
 if(RM){pe.hidden=true;return}
 hiding=true;
 var an=pe.animate([{transform:"none",opacity:1},{transform:"translateX(10vw)",opacity:0}],{duration:460,easing:EASE,fill:"forwards"});
 an.onfinish=function(){pe.hidden=true;an.cancel();hiding=false}}
function go(id){location.hash=id}
function route(){var id=location.hash.slice(1),i=PROJECTS.findIndex(function(p){return p.id===id});
 if(i>=0)show(i);else if(!id||id==="work"||id==="about"){hide();if(id){var e=$(id);e&&e.scrollIntoView()}}else hide()}
window.addEventListener("hashchange",route);
$("back").onclick=function(){history.pushState(null,"",location.pathname);if(window.scrollY<10)$("work").scrollIntoView({behavior:"instant"});hide()};
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(layout,120)});

/* lightbox: приближение из превью, слайдер между кадрами, приближение обратно при закрытии */
var EASE="cubic-bezier(.22,.8,.2,1)",RM=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
var lb=$("lb"),stage=$("lbs"),hidT=null,closing=false;
function showThumb(){if(hidT){hidT.style.visibility="";hidT=null}}
function hideThumb(k){showThumb();var t=thumbs[k];if(t){t.style.visibility="hidden";hidT=t}}
function mkSlide(k){var sl=document.createElement("div");sl.className="sl";sl.appendChild(ph(PROJECTS[cur].renders[k]));stage.appendChild(sl);return sl}
function fromRect(n,t){var a=t.getBoundingClientRect(),b=n.getBoundingClientRect();
 return "translate("+(a.left-b.left)+"px,"+(a.top-b.top)+"px) scale("+(a.width/b.width)+","+(a.height/b.height)+")"}
function fadeUI(from,to,dur){if(RM)return;$("lbbg").animate([{opacity:from},{opacity:to}],{duration:dur,easing:"ease",fill:"forwards"});
 lb.querySelectorAll("button").forEach(function(b){b.animate([{opacity:from},{opacity:to}],{duration:dur,easing:"ease",fill:"forwards"})})}
function openLb(k){
 lbI=k;closing=false;lb.hidden=false;lb.getAnimations({subtree:true}).forEach(function(a){a.cancel()});
 stage.innerHTML="";var n=mkSlide(k).firstChild,t=thumbs[k];hideThumb(k);
 if(!RM){fadeUI(0,1,380);n.style.transformOrigin="0 0";
  if(t)n.animate([{transform:fromRect(n,t)},{transform:"none"}],{duration:560,easing:EASE});
  else n.animate([{opacity:0,transform:"scale(.92)"},{opacity:1,transform:"none"}],{duration:450,easing:EASE})}
 $("lx").focus({preventScroll:true})}
function closeLb(instant){
 if(lb.hidden||closing)return;
 var sl=stage.querySelector(".sl:not(.out)");
 var fin=function(){lb.hidden=true;stage.innerHTML="";showThumb();closing=false;lb.getAnimations({subtree:true}).forEach(function(a){a.cancel()})};
 if(instant===true||RM||!sl){fin();return}
 closing=true;stage.querySelectorAll(".sl.out").forEach(function(e){e.remove()});
 var n=sl.firstChild,t=thumbs[lbI],a;
 if(t){var tb=t.getBoundingClientRect();if(tb.bottom<60||tb.top>window.innerHeight-60)t.scrollIntoView({block:"center"})}
 fadeUI(1,0,520);n.style.transformOrigin="0 0";
 if(t)a=n.animate([{transform:"none"},{transform:fromRect(n,t)}],{duration:560,easing:EASE,fill:"forwards"});
 else a=n.animate([{opacity:1,transform:"none"},{opacity:0,transform:"scale(.92)"}],{duration:450,easing:EASE,fill:"forwards"});
 a.onfinish=fin}
function step(d){
 if(closing)return;
 var N=PROJECTS[cur].renders.length,k=(lbI+d+N)%N,old=stage.querySelector(".sl:not(.out)");
 stage.querySelectorAll(".sl.out").forEach(function(e){e.remove()});
 lbI=k;hideThumb(k);var sl=mkSlide(k);
 if(RM){if(old)old.remove();return}
 if(old){old.classList.add("out");var o=old.animate([{transform:"none",opacity:1},{transform:"translateX("+(-d*60)+"vw)",opacity:0}],{duration:620,easing:EASE,fill:"forwards"});o.onfinish=function(){old.remove()}}
 sl.animate([{transform:"translateX("+(d*60)+"vw)",opacity:0},{transform:"none",opacity:1}],{duration:620,easing:EASE})}
$("lx").onclick=closeLb;$("lp").onclick=function(){step(-1)};$("ln").onclick=function(){step(1)};
lb.addEventListener("click",function(e){if(!e.target.closest(".ph")&&!e.target.closest("button"))closeLb()});
document.addEventListener("keydown",function(e){
 if(!$("lb").hidden){if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)}
 else if(cur>=0&&e.key==="Escape")$("back").click()});
var tx=0,ty=0;
$("lb").addEventListener("touchstart",function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$("lb").addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))step(dx<0?1:-1);else if(dy>90&&Math.abs(dy)>Math.abs(dx))closeLb()},{passive:true});
route();
</script>
</body>
